            <button type="button" class="bv-modal-btn bv-modal-btn-primary" onclick="handleBestValueRepairChoice(true)">Yes, Add Protection</button>
        </div>

<script>
(function() {
    let repairOptionId = null;
    let repairServicePrice = 95.00; // Default fallback to 95.00

    async function prefetchRepairServiceDetails() {
        try {
            let res = await fetch('/lifetime-half-price-repair-service/');
            if (!res.ok) return;
            let html = await res.text();
            
            let match = html.match(/name=["']attribute\[(\d+)\]["']/i);
            if (match) {
                repairOptionId = parseInt(match[1]);
            }

            let price = null;
            let parser = new DOMParser();
            let doc = parser.parseFromString(html, 'text/html');
            
            let ogPriceMeta = doc.querySelector('meta[property="og:price:amount"]');
            if (ogPriceMeta) {
                let val = parseFloat(ogPriceMeta.getAttribute('content'));
                if (!isNaN(val)) price = val;
            }

            if (price === null) {
                let priceEl = doc.querySelector('[data-product-price-without-tax]') || 
                              doc.querySelector('[data-product-price-with-tax]') ||
                              doc.querySelector('.price--withoutTax') ||
                              doc.querySelector('.price--withTax') ||
                              doc.querySelector('.productView-price .price');
                if (priceEl) {
                    let text = priceEl.textContent.trim();
                    let valMatch = text.match(/[\d.,]+/);
                    if (valMatch) {
                        let val = parseFloat(valMatch[0].replace(/,/g, ''));
                        if (!isNaN(val)) price = val;
                    }
                }
            }

            if (price !== null) {
                repairServicePrice = price;
            }
        } catch (e) {
            console.error("Failed to fetch repair service details:", e);
        }
    }
    prefetchRepairServiceDetails();

    let currentAddContext = null;

    function openBestValueRepairModal(productId, sku, btn) {
        currentAddContext = { productId, sku, btn };
        
        let formattedPrice = '$' + (repairServicePrice % 1 === 0 ? repairServicePrice : repairServicePrice.toFixed(2));
        let priceEl = document.getElementById('bv-modal-repair-price');
        if (priceEl) priceEl.textContent = formattedPrice;
        
        let modal = document.getElementById('bv-repair-modal');
        if (modal) modal.style.display = 'flex';
    }

    function closeBestValueRepairModal() {
        let modal = document.getElementById('bv-repair-modal');
        if (modal) modal.style.display = 'none';
        currentAddContext = null;
    }

    async function handleBestValueRepairChoice(addRepair) {
        if (!currentAddContext) return;
        
        let { productId, sku, btn } = currentAddContext;
        closeBestValueRepairModal();
        
        if (!addRepair) {
            await customBestValueAddToCart(productId, sku, btn);
        } else {
            await customBestValueAddWithRepair(productId, sku, btn);
        }
    }

    // Expose handlers to window scope for inline onclick trigger support
    window.openBestValueRepairModal = openBestValueRepairModal;
    window.closeBestValueRepairModal = closeBestValueRepairModal;
    window.handleBestValueRepairChoice = handleBestValueRepairChoice;

    function showToast(message, isError) {
        let toast = document.getElementById('bs-toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'bs-toast';
            document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.style.background = isError ? '#d9342b' : '#1a56c4';
        toast.style.opacity = '1';
        clearTimeout(toast._hideTimeout);
        toast._hideTimeout = setTimeout(() => {
            toast.style.opacity = '0';
        }, 2500);
    }

    async function updateCartCount() {
        try {
            const res = await fetch('/api/storefront/carts', { credentials: 'same-origin' });
            if (!res.ok) return;
            const carts = await res.json();
            const cart = carts[0];
            if (!cart) return;
            const totalQty =
                (cart.lineItems?.physicalItems || []).reduce((s, i) => s + i.quantity, 0) +
                (cart.lineItems?.digitalItems || []).reduce((s, i) => s + i.quantity, 0);

            document.querySelectorAll('.cart-quantity, [data-cart-quantity], .countPill').forEach(el => {
                el.textContent = totalQty;
                if (totalQty > 0) el.classList.add('countPill--positive');
            });
        } catch (e) {
            console.error('Cart count update error:', e);
        }
    }

    async function customBestValueAddToCart(productId, sku, btn) {
        console.log('ADD FUNCTION');

        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = 'Adding...';
        console.log('ADD', productId, sku);

        try {
            const formData = new FormData();
            formData.append('product_id', productId);
            formData.append('qty[]', 1);
            formData.append('sku', sku);
            const response = await fetch('/remote/v1/cart/add', {
                method: 'POST',
                body: formData,
                credentials: 'same-origin'
            });

            const result = await response.json().catch(() => ({}));

            const errMsg = result.error || result.message ||
                result.data?.error || result.data?.message ||
                (result.success === false ? 'Could not be added' : null);

            if (!response.ok || errMsg) {
                let finalMsg = "This appliance may already be in your cart or has been sold.";
                if (errMsg && typeof errMsg === 'string' && !errMsg.toLowerCase().includes("stock") && !errMsg.toLowerCase().includes("enough") && !errMsg.toLowerCase().includes("quantity")) {
                    finalMsg = errMsg;
                }
                showToast(finalMsg, true);
                btn.innerHTML = original;
                btn.disabled = false;
                return;
            }

            showToast('Added to cart!', false);
            btn.classList.add('added');
            btn.innerHTML = '✓ Added';
            updateCartCount();

            setTimeout(() => {
                window.location.href = 'https://undervalueappliances.ca/cart.php';
            }, 800);

        } catch (error) {
            console.error('Add To Cart Error:', error);
            showToast('Something went wrong, please try again', true);
            btn.innerHTML = original;
            btn.disabled = false;
        }
    }

    async function customBestValueAddWithRepair(productId, sku, btn) {
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = 'Adding...';

        try {
            const formData = new FormData();
            formData.append('product_id', productId);
            formData.append('qty[]', 1);
            formData.append('sku', sku);
            const response = await fetch('/remote/v1/cart/add', {
                method: 'POST',
                body: formData,
                credentials: 'same-origin'
            });

            const result = await response.json().catch(() => ({}));

            const errMsg = result.error || result.message ||
                result.data?.error || result.data?.message ||
                (result.success === false ? 'Could not be added' : null);

            if (!response.ok || errMsg) {
                let finalMsg = "This appliance may already be in your cart or has been sold.";
                if (errMsg && typeof errMsg === 'string' && !errMsg.toLowerCase().includes("stock") && !errMsg.toLowerCase().includes("enough") && !errMsg.toLowerCase().includes("quantity")) {
                    finalMsg = errMsg;
                }
                showToast(finalMsg, true);
                btn.innerHTML = original;
                btn.disabled = false;
                return;
            }

            // Get Cart ID
            let cartId = null;
            try {
                const cartRes = await fetch('/api/storefront/carts', { credentials: 'same-origin' });
                if (cartRes.ok) {
                    const carts = await cartRes.json();
                    cartId = carts[0]?.id;
                }
            } catch (e) {
                console.error("Cart retrieval error", e);
            }

            // Add repair service
            if (cartId) {
                try {
                    let lineItemPayload = {
                        quantity: 1,
                        productId: 1206
                    };
                    if (repairOptionId) {
                        lineItemPayload.optionSelections = [
                            {
                                optionId: repairOptionId,
                                optionValue: sku || 'No SKU'
                            }
                        ];
                    }
                    await fetch(`/api/storefront/carts/${cartId}/items`, {
                        method: "POST",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({
                            lineItems: [lineItemPayload]
                        })
                    });
                } catch (err) {
                    console.error("Repair service addition error:", err);
                }
            }

            showToast('Added with protection!', false);
            btn.classList.add('added');
            btn.innerHTML = '✓ Added';
            updateCartCount();

            setTimeout(() => {
                window.location.href = 'https://undervalueappliances.ca/cart.php';
            }, 800);

        } catch (error) {
            console.error('Add To Cart With Repair Error:', error);
            showToast('Something went wrong, please try again', true);
            btn.innerHTML = original;
            btn.disabled = false;
        }
    }

    async function loadBestSeller() {
        try {
            const response = await fetch(
              'https://bigcommerce-backend-ne60.onrender.com/api/best-value'
            );
            const products = await response.json();
            console.log(products);

            if (!products || !Array.isArray(products) || products.length === 0) {
                document.getElementById('best-value-container').innerHTML = `
                    <div style="color: #fff; font-size: 18px; font-weight: bold; text-align: center; padding: 40px 20px;">
                        No products in best value
                    </div>
                `;
                return;
            }

            let html = '<div class="best-seller-grid">';
            let SUFFIX_RE = /(\s*\*\s*\d*|\s+[1-9])\s*$/;
            products.slice(0,6).forEach(product => {
                let cleanName = (product.name || '').replace(SUFFIX_RE, '');
                html += `
                    <div class="product-card">
                        <a href="${product.url}">
                            <img src="${product.image}" alt="${cleanName}">
                        </a>
                        <div class="product-title">
                            ${cleanName}
                        </div>
                        <div class="product-price-wrap">
                            <div class="product-price-row">
                                <span class="product-price">
                                    <span>$</span>${Number(product.sale_price || product.price).toFixed(2)}
                                </span>
                                ${
                                  product.sale_price
                                  ? `<span class="old-price"><span>$</span>${Number(product.price).toFixed(2)}</span>`
                                  : ''
                                }
                            </div>
                        </div>
                        <button
                            class="cart-btn"
                            type="button"
                            style="margin-top:auto;"
                            onclick="openBestValueRepairModal('${product.id}','${product.sku}', this)"
                        >
                            <svg width="18" height="18" viewBox="0 0 122.9 107.5" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3.9,7.9C1.8,7.9,0,6.1,0,3.9C0,1.8,1.8,0,3.9,0h10.2c0.1,0,0.3,0,0.4,0c3.6,0.1,6.8,0.8,9.5,2.5c3,1.9,5.2,4.8,6.4,9.1 c0,0.1,0,0.2,0.1,0.3l1,4H119c2.2,0,3.9,1.8,3.9,3.9c0,0.4-0.1,0.8-0.2,1.2l-10.2,41.1c-0.4,1.8-2,3-3.8,3v0H44.7 c1.4,5.2,2.8,8,4.7,9.3c2.3,1.5,6.3,1.6,13,1.5h0.1v0h45.2c2.2,0,3.9,1.8,3.9,3.9c0,2.2-1.8,3.9-3.9,3.9H62.5v0 c-8.3,0.1-13.4-0.1-17.5-2.8c-4.2-2.8-6.4-7.6-8.6-16.3l0,0L23,13.9c0-0.1,0-0.1-0.1-0.2c-0.6-2.2-1.6-3.7-3-4.5 c-1.4-0.9-3.3-1.3-5.5-1.3c-0.1,0-0.2,0-0.3,0H3.9L3.9,7.9z M96,88.3c5.3,0,9.6,4.3,9.6,9.6c0,5.3-4.3,9.6-9.6,9.6 c-5.3,0-9.6-4.3-9.6-9.6C86.4,92.6,90.7,88.3,96,88.3L96,88.3z M53.9,88.3c5.3,0,9.6,4.3,9.6,9.6c0,5.3-4.3,9.6-9.6,9.6 c-5.3,0-9.6-4.3-9.6-9.6C44.3,92.6,48.6,88.3,53.9,88.3L53.9,88.3z M33.7,23.7l8.9,33.5h63.1l8.3-33.5H33.7L33.7,23.7z"/>
                            </svg>
                            Add to cart
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('best-value-container').innerHTML = html;
        } catch(err) {
            console.error(err);
        }
    }
    loadBestSeller();
})();
</script>
